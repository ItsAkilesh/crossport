# File: tools/difftest/Cargo.toml
# Purpose: Manifest for the differential test runner (run a command, compare two results)
# Author: Akilesh
# Date: 2026-10-28

[package]
name = "difftest"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "difftest"
path = "src/lib.rs"

[[bin]]
name = "difftest"
path = "src/main.rs"

# Test support: a tiny program the integration tests run to observe arguments, environment, stdin and files.
[[bin]]
name = "difftest-probe"
path = "tests/support/probe.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
