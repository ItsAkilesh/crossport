# File: installer/Cargo.toml
# Purpose: Manifest for the Crossport setup program and the AppImage launcher (one library, two binaries)
# Author: Akilesh
# Date: 2026-11-05

[package]
name = "crossport-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "crossport_setup"
path = "src/lib.rs"

[[bin]]
name = "crossport-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "crossport-open"
path = "src/bin/open.rs"

[dependencies]
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
backhand = { version = "=0.25.5", default-features = false, features = ["gzip", "zstd", "xz"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[lints.rust]
unsafe_code = "deny"
