# File: .github/workflows/release.yml
# Purpose: On a version tag, build Crossport for Windows, pack Crossport-Setup.exe and publish it with its SHA-256 checksum
# Author: Akilesh
# Date: 2026-11-05
#
# Tag a commit `vMAJOR.MINOR.PATCH` (for example v0.8.0) to run it. The tag is stamped into the programs as their version,
# which is what the update check compares against.
#
# Signing is optional. When the repository secret CROSSPORT_SIGN_PFX_BASE64 exists (a base64 encoded .pfx holding a code
# signing certificate and its key) the staged programs, the uninstaller and the installer are Authenticode signed with
# tools/ci/sign-windows.ps1. Without it the release is published unsigned and says so. Secrets used:
#   CROSSPORT_SIGN_PFX_BASE64   the certificate file, base64 encoded
#   CROSSPORT_SIGN_PASSWORD     its password (omit when the file has none)
# Optional repository variable CROSSPORT_SIGN_TIMESTAMP picks the timestamp service from the allowlist in the script.
# The build job holds no write permission; only the publish job can create the release, and it never sees the secrets.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      HAS_SIGNING: ${{ secrets.CROSSPORT_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $RELEASE_TAG is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          translator_version=$(sed -n 's/^version = "\(.*\)"/\1/p' translator/Cargo.toml | head -n 1)
          [[ "v$translator_version" == "$RELEASE_TAG" ]] || echo "::warning::tag $RELEASE_TAG differs from the translator version $translator_version"
      - name: Build the translator
        run: cargo build --release --locked --manifest-path translator/Cargo.toml
      - name: Build the shim DLL
        run: tools/build-shim.sh
      - name: Fetch the runtime pack, checked against its pins
        run: |
          py=python3
          command -v python3 >/dev/null || py=python
          "$py" tools/runtime/fetch_pack.py tools/runtime/pack.json build/pack-cache build/runtime-pack
      - name: Write the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          PFX_BASE64: ${{ secrets.CROSSPORT_SIGN_PFX_BASE64 }}
        run: |
          umask 077
          printf '%s' "$PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/crossport-sign.pfx"
      - name: Pack the installer (signed when a certificate was given)
        env:
          CROSSPORT_RELEASE_VERSION: ${{ github.ref_name }}
          CROSSPORT_SIGN_PASSWORD: ${{ secrets.CROSSPORT_SIGN_PASSWORD }}
          CROSSPORT_SIGN_TIMESTAMP: ${{ vars.CROSSPORT_SIGN_TIMESTAMP }}
        run: |
          if [[ "$HAS_SIGNING" == "true" ]]; then
            export CROSSPORT_SIGN_PFX="$RUNNER_TEMP/crossport-sign.pfx"
            export CROSSPORT_SIGN="pwsh -File tools/ci/sign-windows.ps1"
          else
            echo "::notice::no signing certificate configured; publishing an unsigned installer"
          fi
          installer/package.sh build/release --runtime build/runtime-pack
          (cd build/release && sha256sum --check SHA256SUMS.txt)
      - name: Remove the signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/crossport-sign.pfx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            build/release/Crossport-Setup.exe
            build/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release
      - name: Publish the release
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/Crossport-Setup.exe release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Crossport $RELEASE_TAG" --verify-tag --generate-notes
