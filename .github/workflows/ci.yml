# File: .github/workflows/ci.yml
# Purpose: Build and run corpus cases on Linux and Windows, then diff the results
# Author: Akilesh
# Date: 2026-10-28

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NATIVE_CASES: hello
  TRANSLATED_CASES: hello_dyn two_libs tls_basic
  LINUX_ONLY_CASES: threads

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format and lint
        run: |
          cargo fmt --check --manifest-path tools/difftest/Cargo.toml
          cargo fmt --check --manifest-path translator/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path tools/difftest/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path translator/Cargo.toml -- -D warnings
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
          python3 -m unittest discover -s tools -p "test_*.py"
      - name: Build and run corpus cases
        run: |
          for corpus_case in $NATIVE_CASES $TRANSLATED_CASES $LINUX_ONLY_CASES; do
            tools/run-case.sh "$corpus_case" linux
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-linux
          path: results/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elf-corpus
          path: build/linux
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
      - name: Build and run native corpus cases
        run: |
          for corpus_case in $NATIVE_CASES; do
            tools/run-case.sh "$corpus_case" windows
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: elf-corpus
          path: build/elf
      - name: Translate the Linux ELF files and run them on Windows
        run: |
          for corpus_case in $TRANSLATED_CASES; do
            tools/run-translated.sh "$corpus_case"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-windows
          path: results/*.json
          if-no-files-found: error

  differential:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Build difftest
        run: cargo build --release --locked --manifest-path tools/difftest/Cargo.toml
      - name: Compare Linux and Windows results
        run: |
          for corpus_case in $NATIVE_CASES $TRANSLATED_CASES; do
            echo "comparing $corpus_case"
            tools/difftest/target/release/difftest compare               "results/$corpus_case-linux.json"               "results/$corpus_case-windows.json"
          done
