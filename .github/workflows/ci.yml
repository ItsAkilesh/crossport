# File: .github/workflows/ci.yml
# Purpose: Build and run corpus cases on Linux and Windows in parallel jobs, then diff the results
# Author: Akilesh
# Date: 2026-10-29
#
# Job graph (the Windows work that needs no Linux output starts at once):
#   lint-test ----------------------------------------------\
#   corpus (Linux) --> windows-translate ---------------------+--> differential
#   windows-shim (unit tests, shim tests, native cases) ------/
# Cargo registries, target directories and the built shim DLL are cached. A manual run can name the
# translated cases to run (the "cases" input) so a single case can be debugged without the whole corpus.

name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      cases:
        description: "Translated corpus cases to run (space separated); empty runs all"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NATIVE_CASES: hello
  TRANSLATED_CASES: ${{ inputs.cases || 'hello_dyn two_libs tls_basic threads vulkan_triangle vulkan_window cxx_exceptions cxx_dynamic posix_io sockets process mmap_files event_loop libc_breadth xlib_draw sdl2_window' }}
  ABORT_CASES: canary_smash
  APPS: lua sqlite3 jq
  CARGO_PATHS: |
    ~/.cargo/registry/index
    ~/.cargo/registry/cache
    ~/.cargo/git/db
    tools/difftest/target
    translator/target

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore the Cargo cache
        id: cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - name: Format and lint
        run: |
          cargo fmt --check --manifest-path tools/difftest/Cargo.toml
          cargo fmt --check --manifest-path translator/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path tools/difftest/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path translator/Cargo.toml -- -D warnings
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
          python3 -m unittest discover -s tools -p "test_*.py"
          (cd tools/corpus && python3 -m unittest discover -p "test_*.py")
      - name: Save the Cargo cache
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}

  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore the Cargo cache
        id: cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - name: Install the build tools, a Vulkan software driver, X11, SDL2 and SquashFS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools libvulkan-dev mesa-vulkan-drivers libxcb1-dev libx11-dev libsdl2-dev xvfb squashfs-tools
      - name: Check the xcb structure layouts against the real headers
        run: gcc -fsyntax-only -Wall -Wextra -Werror tests/shim/xcb_layout_check.c tests/shim/xlib_layout_check.c
      - name: Build and run corpus cases
        run: |
          xvfb-run -a bash -c 'for corpus_case in $NATIVE_CASES $TRANSLATED_CASES $ABORT_CASES; do tools/run-case.sh "$corpus_case" linux; done'
      - name: Package the corpus apps and record their Linux results
        run: |
          for app in $APPS; do
            tools/corpus/linux_baseline.sh "$app"
          done
      - name: Save the Cargo cache
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-linux
          path: |
            build/corpus/images/*.AppImage
            results/apps/*-linux.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-linux
          path: results/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elf-corpus
          path: build/linux
          if-no-files-found: error

  windows-shim:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore the Cargo cache
        id: cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - name: Restore the shim DLL
        id: shim
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/shim
          key: shim-v1-${{ runner.os }}-${{ hashFiles('shim/**', 'tools/build-shim.sh', 'tools/gen-*.py', 'third_party/vulkan/vk.xml') }}
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
      - name: Test the shim's C library against recorded glibc output
        run: |
          [[ -f build/shim/crossport_libc.dll ]] || tools/build-shim.sh
          tools/test-shim.sh
      - name: Build and run native corpus cases
        run: |
          for corpus_case in $NATIVE_CASES; do
            tools/run-case.sh "$corpus_case" windows
          done
      - name: Save the shim DLL
        if: always() && steps.shim.outputs.cache-hit != 'true' && hashFiles('build/shim/crossport_libc.dll') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/shim
          key: shim-v1-${{ runner.os }}-${{ hashFiles('shim/**', 'tools/build-shim.sh', 'tools/gen-*.py', 'third_party/vulkan/vk.xml') }}
      - name: Save the Cargo cache
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-windows-native
          path: results/*.json
          if-no-files-found: error

  windows-translate:
    needs: corpus
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore the Cargo cache
        id: cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - name: Restore the shim DLL
        id: shim
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/shim
          key: shim-v1-${{ runner.os }}-${{ hashFiles('shim/**', 'tools/build-shim.sh', 'tools/gen-*.py', 'third_party/vulkan/vk.xml') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: elf-corpus
          path: build/elf
      - name: Install a Vulkan loader and a software driver
        run: tools/ci/install-vulkan-windows.sh
      - name: Translate the Linux ELF files and run them on Windows
        run: |
          for corpus_case in $TRANSLATED_CASES $ABORT_CASES; do
            tools/run-translated.sh "$corpus_case"
          done
      - name: Show the translated results (single-case runs only)
        if: inputs.cases != '' && always()
        run: |
          for corpus_case in $TRANSLATED_CASES; do
            cat "results/$corpus_case-windows.json" || true
          done
      - name: Stress the threaded program for races
        if: inputs.cases == ''
        run: tools/stress.sh threads 200
      - name: A smashed stack must abort, not return
        run: |
          for corpus_case in $ABORT_CASES; do
            python3 tools/check_abort.py "results/$corpus_case-windows.json" "stack smashing detected"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apps-linux
          path: .
      - name: Unpack, translate and run the corpus apps on Windows
        if: inputs.cases == ''
        run: |
          for app in $APPS; do
            tools/corpus/translate_and_run.sh "$app"
          done
      - name: Convert an AppImage in one step and check the environment file is applied
        if: inputs.cases == ''
        run: |
          translator/target/release/crossport.exe convert build/corpus/images/lua.AppImage --shim build/shim/crossport_libc.dll --out build/convert/lua
          build/convert/lua/lua.exe -e "print(os.getenv('APPDIR') ~= nil, 6 * 7)" | grep -qx "true	42"
      - name: Save the shim DLL
        if: always() && steps.shim.outputs.cache-hit != 'true' && hashFiles('build/shim/crossport_libc.dll') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/shim
          key: shim-v1-${{ runner.os }}-${{ hashFiles('shim/**', 'tools/build-shim.sh', 'tools/gen-*.py', 'third_party/vulkan/vk.xml') }}
      - name: Save the Cargo cache
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_PATHS }}
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('tools/difftest/Cargo.lock', 'translator/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: result-windows-translated
          path: results/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-windows
          path: |
            results/apps/*-windows.json
            results/apps/*-translate-error.txt
          if-no-files-found: ignore

  differential:
    needs: [corpus, windows-shim, windows-translate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Build difftest
        run: cargo build --release --locked --manifest-path tools/difftest/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apps-linux
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apps-windows
          path: results/apps
      - name: Compare the corpus apps and enforce the pass-rate ratchet
        run: |
          python3 tools/corpus/compare_results.py --results results/apps --apps $APPS \
            --difftest tools/difftest/target/release/difftest \
            --baseline tests/corpus/baseline.json --summary results/apps-summary.json
      - name: Compare Linux and Windows results
        run: |
          for corpus_case in $NATIVE_CASES $TRANSLATED_CASES; do
            echo "comparing $corpus_case"
            tools/difftest/target/release/difftest compare \
              "results/$corpus_case-linux.json" "results/$corpus_case-windows.json"
          done
