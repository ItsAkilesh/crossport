# File: .github/workflows/ci.yml
# Purpose: Build and run corpus cases on Linux and Windows, then diff the results
# Author: Akilesh
# Date: 2026-10-28

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CORPUS_CASE: hello
  TRANSLATED_CASE: hello_dyn

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
      - name: Build and run corpus cases
        run: |
          tools/run-case.sh "$CORPUS_CASE" linux
          tools/run-case.sh "$TRANSLATED_CASE" linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-linux
          path: results/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elf-${{ env.TRANSLATED_CASE }}
          path: build/linux/${{ env.TRANSLATED_CASE }}
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
      - name: Build and run native corpus case
        run: tools/run-case.sh "$CORPUS_CASE" windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: elf-${{ env.TRANSLATED_CASE }}
          path: build/elf
      - name: Translate the Linux ELF and run it on Windows
        run: tools/run-translated.sh "$TRANSLATED_CASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-windows
          path: results/*.json
          if-no-files-found: error

  differential:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Build difftest
        run: cargo build --release --locked --manifest-path tools/difftest/Cargo.toml
      - name: Compare Linux and Windows results
        run: |
          for corpus_case in "$CORPUS_CASE" "$TRANSLATED_CASE"; do
            echo "comparing $corpus_case"
            tools/difftest/target/release/difftest compare               "results/$corpus_case-linux.json"               "results/$corpus_case-windows.json"
          done
