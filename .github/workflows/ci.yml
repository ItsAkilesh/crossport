# File: .github/workflows/ci.yml
# Purpose: Build and run corpus cases on Linux and Windows, then diff the results
# Author: Akilesh
# Date: 2026-10-29

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NATIVE_CASES: hello
  TRANSLATED_CASES: hello_dyn two_libs tls_basic threads vulkan_triangle vulkan_window cxx_exceptions cxx_dynamic posix_io sockets
  ABORT_CASES: canary_smash
  APPS: lua sqlite3 jq

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format and lint
        run: |
          cargo fmt --check --manifest-path tools/difftest/Cargo.toml
          cargo fmt --check --manifest-path translator/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path tools/difftest/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --manifest-path translator/Cargo.toml -- -D warnings
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
          python3 -m unittest discover -s tools -p "test_*.py"
          (cd tools/corpus && python3 -m unittest discover -p "test_*.py")
      - name: Install the Vulkan build tools and a software driver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools libvulkan-dev mesa-vulkan-drivers libxcb1-dev xvfb
      - name: Build and run corpus cases
        run: |
          xvfb-run -a bash -c 'for corpus_case in $NATIVE_CASES $TRANSLATED_CASES $ABORT_CASES; do tools/run-case.sh "$corpus_case" linux; done'
      - name: Install SquashFS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
      - name: Package the corpus apps and record their Linux results
        run: |
          for app in $APPS; do
            tools/corpus/linux_baseline.sh "$app"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-linux
          path: |
            build/corpus/images/*.AppImage
            results/apps/*-linux.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-linux
          path: results/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elf-corpus
          path: build/linux
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      VK_LOADER_DEBUG: error,warn,driver
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: |
          cargo test --locked --manifest-path tools/difftest/Cargo.toml
          cargo test --locked --manifest-path translator/Cargo.toml
      - name: Test the shim's C library against recorded glibc output
        run: |
          tools/build-shim.sh
          tools/test-shim.sh
      - name: Build and run native corpus cases
        run: |
          for corpus_case in $NATIVE_CASES; do
            tools/run-case.sh "$corpus_case" windows
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: elf-corpus
          path: build/elf
      - name: Install a Vulkan loader and a software driver
        run: tools/ci/install-vulkan-windows.sh
      - name: Translate the Linux ELF files and run them on Windows
        run: |
          for corpus_case in $TRANSLATED_CASES $ABORT_CASES; do
            tools/run-translated.sh "$corpus_case"
          done
      - name: Stress the threaded program for races
        run: tools/stress.sh threads 200
      - name: A smashed stack must abort, not return
        run: |
          for corpus_case in $ABORT_CASES; do
            python3 tools/check_abort.py "results/$corpus_case-windows.json" "stack smashing detected"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apps-linux
          path: .
      - name: Unpack, translate and run the corpus apps on Windows
        run: |
          for app in $APPS; do
            tools/corpus/translate_and_run.sh "$app"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-windows
          path: results/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-windows
          path: |
            results/apps/*-windows.json
            results/apps/*-translate-error.txt
          if-no-files-found: ignore

  differential:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Build difftest
        run: cargo build --release --locked --manifest-path tools/difftest/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apps-linux
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apps-windows
          path: results/apps
      - name: Compare the corpus apps and enforce the pass-rate ratchet
        run: |
          python3 tools/corpus/compare_results.py --results results/apps --apps $APPS             --difftest tools/difftest/target/release/difftest             --baseline tests/corpus/baseline.json --summary results/apps-summary.json
      - name: Compare Linux and Windows results
        run: |
          for corpus_case in $NATIVE_CASES $TRANSLATED_CASES; do
            echo "comparing $corpus_case"
            tools/difftest/target/release/difftest compare               "results/$corpus_case-linux.json"               "results/$corpus_case-windows.json"
          done
