# File: .github/workflows/fuzz.yml
# Purpose: Fuzz the translator with hostile ELF and SquashFS input: a short smoke run per PR, a long scheduled run
# Author: Akilesh
# Date: 2026-11-06
#
# Targets live in fuzz/ (cargo-fuzz, libFuzzer with AddressSanitizer). A crash, hang or out-of-memory input is
# uploaded as an artifact; the seed corpora are in fuzz/corpus. The scheduled run is the Milestone 9 exit
# criterion (24 hours without a translator crash), split into one job per target so each fits a job's time limit
# and the nightly runs add up.

name: fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "translator/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned nightly: libFuzzer instrumentation needs one. Bump deliberately, not by accident.
  NIGHTLY: nightly-2026-10-01
  CARGO_FUZZ_VERSION: 0.13.2
  SMOKE_SECONDS: 60
  SCHEDULED_SECONDS: 21000
  TARGET_TIMEOUT_SECONDS: 20
  MEMORY_LIMIT_MB: 2048

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 400 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - analyze_elf
          - translate_exe
          - translate_lib
          - shim_pe
          - unpack_image
          - unpack_squashfs
          - convert
          - cli_parse
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned nightly toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools-preview
          rustup default "$NIGHTLY"
      - name: Restore the Cargo cache
        id: cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ matrix.target }}-${{ runner.os }}-${{ env.NIGHTLY }}-${{ hashFiles('fuzz/Cargo.lock', 'translator/Cargo.lock') }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --version "=$CARGO_FUZZ_VERSION" --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          RUN_SECONDS: ${{ github.event_name == 'schedule' && env.SCHEDULED_SECONDS || github.event_name == 'workflow_dispatch' && inputs.seconds || env.SMOKE_SECONDS }}
        run: |
          mkdir -p "work/${{ matrix.target }}"
          cp -r "corpus/${{ matrix.target }}/." "work/${{ matrix.target }}/"
          cargo fuzz run --fuzz-dir . --features libfuzzer "fuzz_${{ matrix.target }}" "work/${{ matrix.target }}" -- \
            -max_total_time="$RUN_SECONDS" \
            -timeout="$TARGET_TIMEOUT_SECONDS" \
            -rss_limit_mb="$MEMORY_LIMIT_MB" \n            -detect_leaks=0 \
            -max_len=1048576
      - name: Save the Cargo cache
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
